worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 20m;

    server {
        listen 80;

        # Path-prefix routing only -- no business logic here. This is a 1:1
        # mapping of today's paths (src/constants/apiEndpoints.ts), so the
        # frontend's apiClient.js baseURL just becomes this gateway's address;
        # no frontend code changes are needed beyond VITE_API_BASE_URL.

        location /api/auth/ {
            proxy_pass http://auth-service:5101;
        }

        location /api/users/ {
            proxy_pass http://users-service:5102;
        }

        location /api/users {
            proxy_pass http://users-service:5102;
        }

        location /api/admin/ {
            proxy_pass http://users-service:5102;
        }

        location /api/medical-history/ {
            proxy_pass http://users-service:5102;
        }

        location /api/medical-history {
            proxy_pass http://users-service:5102;
        }

        location /api/vaccinations/ {
            proxy_pass http://users-service:5102;
        }

        location /api/vaccinations {
            proxy_pass http://users-service:5102;
        }

        location /api/translations/ {
            proxy_pass http://users-service:5102;
        }

        location /uploads/ {
            proxy_pass http://users-service:5102;
        }

        location /api/vitals/ {
            proxy_pass http://health-data-service:5103;
        }

        location /api/vitals {
            proxy_pass http://health-data-service:5103;
        }

        location /api/forms/ {
            proxy_pass http://health-data-service:5103;
        }

        location /api/forms {
            proxy_pass http://health-data-service:5103;
        }

        location /api/alerts/ {
            proxy_pass http://health-data-service:5103;
        }

        location /api/alerts {
            proxy_pass http://health-data-service:5103;
        }

        location /api/doctors/ {
            proxy_pass http://doctors-appointments-service:5104;
        }

        location /api/doctors {
            proxy_pass http://doctors-appointments-service:5104;
        }

        location /api/appointments/ {
            proxy_pass http://doctors-appointments-service:5104;
        }

        location /api/appointments {
            proxy_pass http://doctors-appointments-service:5104;
        }

        # mediAssistService.js calls /api/mediassist/* directly (its own
        # MEDIASSIST_BASE_URL, not the apiEndpoints.ts AI_ENDPOINTS constant,
        # which is dead code) -- no prefix stripping needed.
        location /api/mediassist/ {
            proxy_pass http://mediassist-service:5001;
        }
    }
}
